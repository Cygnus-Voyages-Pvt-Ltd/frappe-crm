; Every Frappe process for the single Railway service. supervisord itself runs
; as root (so the entrypoint can chown the volume) and drops each program to the
; `frappe` user. All output goes to the container log, which is what Railway
; shows in Deploy Logs.

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid
loglevel=info

[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[program:nginx]
command=/usr/local/bin/nginx-entrypoint.sh
; No `user=`: nginx inherits supervisord's user. Under root (Railway sets
; RAILWAY_RUN_UID=0 so the volume can be chowned) the master needs to stay root
; to open /dev/stdout and /dev/stderr -- those pipes are root-owned, and a
; frappe-owned master dies with "open() /var/log/nginx/error.log (13: Permission
; denied)". The entrypoint adds `user frappe;` to nginx.conf so the workers that
; actually serve requests are unprivileged.
directory=/home/frappe/frappe-bench
priority=10
autostart=true
autorestart=true
startsecs=5
startretries=10
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:gunicorn]
command=/home/frappe/frappe-bench/env/bin/gunicorn --chdir=/home/frappe/frappe-bench/sites --bind=127.0.0.1:8000 --threads=%(ENV_GUNICORN_THREADS)s --workers=%(ENV_GUNICORN_WORKERS)s --worker-class=gthread --worker-tmp-dir=/dev/shm --timeout=%(ENV_GUNICORN_TIMEOUT)s --preload frappe.app:application
user=frappe
directory=/home/frappe/frappe-bench/sites
environment=HOME="/home/frappe",USER="frappe"
priority=20
autostart=true
autorestart=true
startsecs=10
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:socketio]
command=node /home/frappe/frappe-bench/apps/frappe/socketio.js
user=frappe
directory=/home/frappe/frappe-bench
environment=HOME="/home/frappe",USER="frappe"
priority=20
autostart=true
autorestart=true
startsecs=10
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:worker-short]
command=/usr/local/bin/bench worker --queue short,default
user=frappe
directory=/home/frappe/frappe-bench
environment=HOME="/home/frappe",USER="frappe"
priority=30
autostart=true
autorestart=true
startsecs=10
stopwaitsecs=360
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; The fork's lead-syncing and domain-enrichment jobs run on the long queue.
[program:worker-long]
command=/usr/local/bin/bench worker --queue long,default,short
user=frappe
directory=/home/frappe/frappe-bench
environment=HOME="/home/frappe",USER="frappe"
priority=30
autostart=true
autorestart=true
startsecs=10
stopwaitsecs=1560
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:scheduler]
command=/usr/local/bin/bench schedule
user=frappe
directory=/home/frappe/frappe-bench
environment=HOME="/home/frappe",USER="frappe"
priority=40
autostart=true
autorestart=true
startsecs=10
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
